apiVersion: apps/v1
kind: Deployment

metadata:
  name: bank-app
  labels:
    app: bank-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: bank-app

  template:
    metadata:
      labels:
        app: bank-app

    spec:
      containers:
        - name: ramya-bankcontainer
          image: ramyar098/bank-app:latest
          ports:
            - containerPort: 80