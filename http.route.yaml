apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ramya-httproute
  namespace: ramya-ns
spec:
  parentRefs:
    - name: ramya-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: my-service
          port: 85

